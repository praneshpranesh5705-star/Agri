name: Build AgriRoot Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core@9 @capacitor/android@9 @capacitor/cli@9

      - name: Prepare web assets directory
        run: mkdir -p out

      - name: Create Android project
        env:
          AGRI_WEB_URL: https://agri-2cjih6r5d-pranesh-bf52.vercel.app
        run: npx cap add android

      - name: Sync Capacitor
        env:
          AGRI_WEB_URL: https://agri-2cjih6r5d-pranesh-bf52.vercel.app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriRoot-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
